<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16182B">
  <meta name="description" content="1 日 1 回、決まった場所に図形が並ぶ幾何学アートをひいて集める試作アプリ。">
  <title>geo-gacha — 唯一無二の幾何学アートをひく</title>

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="geo-gacha">
  <meta property="og:title" content="geo-gacha — 唯一無二の幾何学アートをひく">
  <meta property="og:description" content="1 日 1 回、決まった場所に図形が並ぶ幾何学アートをひいて集める試作アプリ。">
  <meta property="og:url" content="https://t-of.github.io/geo-gacha/">
  <meta property="og:image" content="https://t-of.github.io/geo-gacha/icons/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">

  <!-- apple-mobile-web-app-status-bar-style は付けない（black-translucent だと iOS 26 で上部が隠れる） -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="geo-gacha">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <link rel="stylesheet" href="./webapp-kit/webapp-kit.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header class="bar">
      <h1 class="bar__title">geo-gacha</h1>
      <div class="bar__actions">
        <button class="pill" data-wak="install" hidden>アプリにする</button>
        <button class="pill" id="soundBtn"></button>
        <button class="pill" data-wak="share">共有</button>
      </div>
    </header>

    <section class="stage" id="stage">
      <div class="today">
        <div class="today__pair">
          <div class="frame"><div class="today__art" id="todayArt"></div></div>
          <figure class="today__map">
            <div id="todayMap"></div>
            <figcaption>配置図（実線＝置かれた／点線＝透明）</figcaption>
          </figure>
        </div>
        <p class="today__no" id="todayNo" hidden></p>
        <button class="draw-btn" id="drawBtn">ひく</button>
        <p class="today__msg" id="todayMsg" hidden></p>
      </div>

      <h2 class="gallery__title">ギャラリー <span id="galleryCount"></span></h2>
      <div class="gallery" id="gallery"></div>
    </section>

    <div class="viewer" id="viewer" hidden>
      <div class="viewer__frame frame">
        <div class="viewer__art" id="viewerArt"></div>
        <p class="viewer__no" id="viewerNo"></p>
        <p class="viewer__date" id="viewerDate"></p>
      </div>
      <button class="viewer__close" id="viewerClose">閉じる</button>
    </div>

    <footer class="credit">
      <a href="/">T.OF...</a> のアプリ ／ <a href="https://t-of.github.io/contact/">問い合わせ</a>
    </footer>
  </main>

  <script src="./webapp-kit/webapp-kit.js"></script>
  <script src="./main.js"></script>
</body>
</html>
